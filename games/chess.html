<!DOCTYPE html>
<html lang="en">

<style>

:root[data-theme="dark"]{--bg:#0d1619;--pn:#142226;--ln:#243a40;--fg:#e3eeec;--mu:#8aa6ab;--sh:rgba(0,0,0,.55)}

</style>

<body>

</main>

 if(cpu()&&S.t!==side()&&hist.length>1){hist.pop();moves.pop();S=hist[hist.length-1]}

const FB=!!(window.firebase&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.databaseURL);
function cancelNet(){
 if(net.refs)net.refs.forEach(r=>r.off());
 (net.timers||[]).forEach(clearInterval);clearTimeout(net.ab);
 if(db&&net.wait){db.ref('lobby/waiting').transaction(w=>w&&w.uid===uid?null:w);db.ref('games/'+net.gid).remove()}
 else if(db&&net.ready&&!over)db.ref('games/'+net.gid+'/p/'+net.color).set(false);
 net={}}
function go(gid,color){
 net={active:1,gid,color,refs:[],timers:[],ready:color==='b',wait:color==='w'};
 S=start();hist=[S];moves=[];sel=-1;tgt=[];last=null;over=0;msg='';flip=color==='b'?1:0;
 const g=db.ref('games/'+gid),on=(r,ev,f)=>{r.on(ev,f);net.refs.push(r)},opp=color==='w'?'b':'w';
 g.child('p/'+color).set(true);g.child('p/'+color).onDisconnect().set(false);
 if(color==='w')net.timers.push(setInterval(()=>db.ref('lobby/waiting').transaction(w=>w&&w.uid===uid?{...w,ts:Date.now()}:w),15000));
 on(g.child('black'),'value',x=>{if(x.val()&&!net.ready){net.ready=1;net.wait=0;net.timers.forEach(clearInterval);note='';refresh()}});
 on(g.child('moves'),'child_added',x=>{const m=x.val(),y=legal(S).find(z=>z.f===m.f&&z.t===m.t&&(z.p||'')===(m.p||''));
  if(m.n===moves.length&&y&&S.t!==net.color&&!over)play(y,1)});
 on(g.child('result'),'value',x=>{const v=x.val();if(v&&!over){const lw=v.by==='w'?'White':'Black',ww=v.by==='w'?'Black':'White';
  msg=v.type==='draw'?'Draw agreed.':v.type==='resign'?lw+' resigned. '+ww+' wins.':ww+' wins. Your opponent left the game.';over=1;refresh()}});
 on(g.child('draw'),'value',x=>{const v=x.val();if(v&&v!==color&&!over)setTimeout(()=>{if(confirm('Your opponent offers a draw. Accept?'))g.child('result').set({type:'draw'});else g.child('draw').remove()},50)});
 on(g.child('p/'+opp),'value',x=>{clearTimeout(net.ab);
  if(x.val()===false&&net.ready&&!over){net.warn='Opponent disconnected. You win in 30 seconds if they do not return.';
   net.ab=setTimeout(()=>{if(!over)g.child('result').set({type:'abandon',by:opp})},30000)}else net.warn='';refresh()});
 refresh()}
async function find(){if(!FB){refresh();return}
 try{cancelNet();msg='';note='Connecting...';refresh();
  if(!db){firebase.initializeApp(FIREBASE_CONFIG);uid=(await firebase.auth().signInAnonymously()).user.uid;db=firebase.database()}
  const gid=db.ref('games').push().key,wr=db.ref('lobby/waiting');let jn=null;
  await db.ref('games/'+gid+'/white').set(uid);
  await wr.transaction(w=>{jn=null;if(w&&w.uid!==uid&&Date.now()-w.ts<45000){jn=w;return null}return{uid,gid,ts:Date.now()}});
  if(jn){db.ref('games/'+gid).remove();await db.ref('games/'+jn.gid+'/black').set(uid);note='';go(jn.gid,'b')}
  else{note='Looking for an opponent...';go(gid,'w')}
 }catch(e){note='Could not connect: '+e.message;refresh()}}
